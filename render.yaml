services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: reachify-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # ── Frontend ──────────────────────────────────────────────────────────────────
  - type: web
    name: reachify-io
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
